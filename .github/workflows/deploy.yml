name: Spring Boot AWS Deployment

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Spring Boot Application
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 3. Verify AWS authentication
      - name: Test AWS connection
        run: |
          aws sts get-caller-identity

      # 4. Deploy application to EC2 through AWS Systems Manager
      - name: Deploy Spring Boot application
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-02e987472d8f85da2" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ssm-user/spring-boot-docker-rest-api/rest-api",
              "git fetch origin",
              "git reset --hard origin/master",
              "./mvnw clean package -DskipTests",
              "sudo systemctl restart springboot",
              "sleep 10",
              "sudo systemctl is-active springboot",
              "curl -f http://localhost:9090/api/v1/categories/"
            ]' \
            --comment "GitHub Actions Spring Boot deployment" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for SSM command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-02e987472d8f85da2"

          # Get command result
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-02e987472d8f85da2"
