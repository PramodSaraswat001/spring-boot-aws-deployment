name: Test Spring Boot SSM Deployment

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  test-aws:
    name: Test AWS and SSM
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 3. Verify AWS authentication
      - name: Test AWS connection
        run: |
          echo "Testing AWS connection..."
          aws sts get-caller-identity

      # 4. Test SSM access and EC2 environment
      - name: Test SSM access and EC2 environment
        shell: bash
        run: |

          echo "Sending SSM command to App EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-02e987472d8f85da2 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo START_DEPLOYMENT_TEST",
              "echo USER:",
              "whoami",
              "echo CURRENT_DIRECTORY:",
              "pwd",
              "echo JAVA_VERSION:",
              "java -version",
              "echo PROJECT_DIRECTORY:",
              "ls -la /home/ssm-user/spring-boot-docker-rest-api/rest-api/",
              "echo TARGET_DIRECTORY:",
              "ls -la /home/ssm-user/spring-boot-docker-rest-api/rest-api/target/",
              "echo JAR_FILE:",
              "ls -lh /home/ssm-user/spring-boot-docker-rest-api/rest-api/target/spring-boot-rest-api-v1.jar",
              "echo SPRINGBOOT_SERVICE:",
              "sudo systemctl status springboot --no-pager",
              "echo WORKING_DIRECTORY:",
              "sudo systemctl show springboot --property=WorkingDirectory",
              "echo SERVICE_FILE:",
              "sudo systemctl cat springboot",
              "echo END_DEPLOYMENT_TEST"
            ]' \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for SSM command to complete..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-02e987472d8f85da2 \
            --region ap-south-1

          echo "Getting SSM command result..."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-02e987472d8f85da2 \
            --region ap-south-1 \
            --query "{Status:Status,StatusDetails:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

          echo "SSM diagnostic test completed."
