name: Spring Boot Rolling Deployment

# Trigger deployment on push to master branch
on:
  push:
    branches:
      - master

# Request OIDC token for AWS authentication
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ASG_NAME: springboot-app-asg
  TARGET_GROUP_NAME: springboot-tg
  APP_DIR: /home/ssm-user/spring-boot-docker-rest-api/rest-api
  SERVICE_NAME: springboot

jobs:
  deploy:
    name: Rolling Deployment
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # 1. Checkout repository code
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Authenticate to AWS via OIDC Role
      # ==========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ==========================================================
      # 3. Verify AWS Identity
      # ==========================================================
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ==========================================================
      # 4. Get active InService instances from ASG
      # ==========================================================
      - name: Get InService ASG instances
        id: instances
        shell: bash
        run: |
          set -euo pipefail

          echo "Querying instances from ASG: $ASG_NAME in $AWS_REGION..."
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --region "$AWS_REGION" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "ERROR: No InService instances found in Auto Scaling Group: $ASG_NAME"
            exit 1
          fi

          echo "Target Instances: $INSTANCE_IDS"
          echo "instance_ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 5. Execute Rolling Deployment via AWS Systems Manager (SSM)
      # ==========================================================
      - name: Deploy to EC2 instances
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_IDS="${{ steps.instances.outputs.instance_ids }}"

          # Fetch Target Group ARN for ALB Health Checks
          echo "Fetching Target Group ARN for $TARGET_GROUP_NAME..."
          TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups \
            --names "$TARGET_GROUP_NAME" \
            --region "$AWS_REGION" \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text)

          if [ -z "$TARGET_GROUP_ARN" ] || [ "$TARGET_GROUP_ARN" = "None" ]; then
            echo "ERROR: Target group '$TARGET_GROUP_NAME' not found."
            exit 1
          fi
          echo "Target Group ARN: $TARGET_GROUP_ARN"

          # Deploy to each instance sequentially
          for INSTANCE_ID in $INSTANCE_IDS
          do
            echo ""
            echo "=========================================================="
            echo "Deploying to Instance: $INSTANCE_ID"
            echo "=========================================================="

            # Send deployment commands via SSM
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 900 \
              --comment "Deploy Spring Boot Application" \
              --parameters 'commands=[
                "set -e",
                "export HOME=/home/ssm-user",
                "echo === PULLING LATEST CODE ===",
                "cd /home/ssm-user/spring-boot-docker-rest-api/rest-api",
                "git config --global --add safe.directory /home/ssm-user/spring-boot-docker-rest-api",
                "git fetch origin master",
                "git reset --hard origin/master",
                "echo === BUILDING JAR WITH MAVEN ===",
                "./mvnw clean package -DskipTests",
                "echo === RESTARTING SPRING BOOT SERVICE ===",
                "sudo systemctl restart springboot",
                "echo === WAITING FOR APPLICATION HEALTH (Port 9090) ===",
                "for i in $(seq 1 60); do if curl -s -f http://localhost:9090/api/v1/categories/ > /dev/null; then echo APPLICATION_HEALTHY; exit 0; fi; if ! sudo systemctl is-active --quiet springboot; then echo ERROR: Spring Boot service stopped unexpectedly; sudo journalctl -u springboot -n 50 --no-pager; exit 1; fi; echo Attempt $i/60: Application starting, waiting 5s...; sleep 5; done; echo ERROR: Application failed to become healthy within 5 minutes; sudo journalctl -u springboot -n 50 --no-pager; exit 1"
              ]' \
              --region "$AWS_REGION" \
              --query "Command.CommandId" \
              --output text)

            echo "Sent SSM Command ID: $COMMAND_ID"

            # --------------------------------------------------------
            # Poll SSM execution status until completion
            # --------------------------------------------------------
            echo "Waiting for build and service restart to complete on $INSTANCE_ID..."
            SUCCESS=false
            for i in $(seq 1 90); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")

              echo "SSM Status ($i/90): $STATUS"

              if [ "$STATUS" = "Success" ]; then
                SUCCESS=true
                break
              elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
                echo "SSM execution failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json
                exit 1
              fi
              sleep 10
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "ERROR: SSM command timed out after 15 minutes."
              exit 1
            fi

            # Print deployment logs from EC2
            echo "--- EC2 Execution Output ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardOutputContent" \
              --output text

            # --------------------------------------------------------
            # Verify Target Group Health in ALB
            # --------------------------------------------------------
            echo ""
            echo "Verifying Application Load Balancer health for $INSTANCE_ID..."
            ALB_HEALTHY=false
            for alb_attempt in $(seq 1 30); do
              HEALTH=$(aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_GROUP_ARN" \
                --targets Id="$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "TargetHealthDescriptions[0].TargetHealth.State" \
                --output text 2>/dev/null || echo "unknown")

              echo "ALB Target State ($alb_attempt/30): $HEALTH"
              if [ "$HEALTH" = "healthy" ]; then
                ALB_HEALTHY=true
                break
              fi
              sleep 10
            done

            if [ "$ALB_HEALTHY" != "true" ]; then
              echo "ERROR: Instance $INSTANCE_ID did not pass ALB health check."
              aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_GROUP_ARN" \
                --targets Id="$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --output json
              exit 1
            fi

            echo "Instance $INSTANCE_ID is Healthy and receiving traffic."
            sleep 5
          done

          echo ""
          echo "=========================================================="
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY ON ALL INSTANCES"
          echo "=========================================================="
