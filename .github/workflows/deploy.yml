name: Spring Boot Rolling Deployment

# Run deployment whenever code is pushed to master
on:
  push:
    branches:
      - master

# Allow GitHub Actions to authenticate with AWS using OIDC
permissions:
  id-token: write
  contents: read

# Common deployment configuration
env:
  AWS_REGION: ap-south-1
  ASG_NAME: springboot-app-asg
  TARGET_GROUP_NAME: springboot-tg
  APP_DIR: /home/ssm-user/spring-boot-docker-rest-api/rest-api
  SERVICE_NAME: springboot

jobs:
  deploy:
    name: Rolling Deployment
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Configure AWS credentials using OIDC
      # ==========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ==========================================================
      # 3. Verify AWS identity
      # ==========================================================
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ==========================================================
      # 4. Get all healthy InService instances from ASG
      # ==========================================================
      - name: Get InService ASG instances
        id: instances
        shell: bash
        run: |
          set -e

          echo "Getting instances from ASG: $ASG_NAME"

          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --region "$AWS_REGION" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService' && HealthStatus=='Healthy'].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "ERROR: No InService and Healthy instances found."
            exit 1
          fi

          echo "Found instances:"
          echo "$INSTANCE_IDS"

          echo "instance_ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 5. Rolling deployment
      # ==========================================================
      - name: Rolling deployment
        shell: bash
        run: |
          set -e

          INSTANCE_IDS="${{ steps.instances.outputs.instance_ids }}"

          echo "=========================================="
          echo "Starting rolling deployment"
          echo "=========================================="
          echo "Instances: $INSTANCE_IDS"

          for INSTANCE_ID in $INSTANCE_IDS
          do

            echo ""
            echo "=========================================="
            echo "Deploying instance: $INSTANCE_ID"
            echo "=========================================="


            # ====================================================
            # 6. Send deployment commands through SSM
            # ====================================================
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 900 \
              --parameters 'commands=[
                "set -e",
                "export HOME=/home/ssm-user",
                "echo START_DEPLOYMENT",
                "echo INSTANCE: $(hostname)",
                "cd /home/ssm-user/spring-boot-docker-rest-api/rest-api",
                "git config --global --add safe.directory /home/ssm-user/spring-boot-docker-rest-api",
                "echo CURRENT_COMMIT:",
                "git rev-parse --short HEAD",
                "echo FETCHING_LATEST_CODE",
                "git fetch origin master",
                "git reset --hard origin/master",
                "echo NEW_COMMIT:",
                "git rev-parse --short HEAD",
                "echo BUILDING_APPLICATION",
                "./mvnw clean package -DskipTests",
                "echo BUILD_SUCCESS",
                "ls -lh target/spring-boot-rest-api-v1.jar",
                "echo RESTARTING_APPLICATION",
                "sudo systemctl restart springboot",
                "echo WAITING_FOR_APPLICATION_TO_BECOME_HEALTHY",
                "for i in {1..60}; do echo HEALTH_CHECK_ATTEMPT_$i_OF_60; if ! sudo systemctl is-active --quiet springboot; then echo ERROR_SPRING_BOOT_SERVICE_STOPPED; sudo systemctl status springboot --no-pager; sudo journalctl -u springboot -n 100 --no-pager; exit 1; fi; if curl --fail --silent --show-error http://localhost:9090/api/v1/categories/ > /dev/null; then echo APPLICATION_IS_HEALTHY; break; fi; echo APPLICATION_NOT_READY_WAITING_5_SECONDS; sleep 5; if [ $i -eq 60 ]; then echo ERROR_APPLICATION_DID_NOT_BECOME_HEALTHY; sudo systemctl status springboot --no-pager; sudo journalctl -u springboot -n 100 --no-pager; sudo ss -lntp | grep 9090 || true; exit 1; fi; done",
                "echo DEPLOYMENT_SUCCESS"
              ]' \
              --region "$AWS_REGION" \
              --query "Command.CommandId" \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"


            # ====================================================
            # 7. Wait for SSM deployment to complete
            # ====================================================
            echo ""
            echo "Waiting for SSM deployment..."

            SUCCESS=false

            for i in {1..90}
            do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")

              echo "Attempt $i/90 - SSM Status: $STATUS"


              # -------------------------------
              # SSM command successful
              # -------------------------------
              if [ "$STATUS" = "Success" ]; then
                SUCCESS=true
                break
              fi


              # -------------------------------
              # SSM command failed
              # -------------------------------
              if [ "$STATUS" = "Failed" ] || \
                 [ "$STATUS" = "Cancelled" ] || \
                 [ "$STATUS" = "TimedOut" ]; then

                echo ""
                echo "=========================================="
                echo "DEPLOYMENT FAILED"
                echo "Instance: $INSTANCE_ID"
                echo "SSM Status: $STATUS"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "{Status:Status,StatusDetails:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json

                exit 1
              fi

              sleep 10

            done


            # ====================================================
            # 8. Check SSM timeout
            # ====================================================
            if [ "$SUCCESS" != "true" ]; then

              echo ""
              echo "ERROR: SSM command did not finish within the expected time."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "{Status:Status,StatusDetails:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}" \
                --output json || true

              exit 1
            fi


            # ====================================================
            # 9. Show deployment output
            # ====================================================
            echo ""
            echo "=========================================="
            echo "Deployment output for $INSTANCE_ID"
            echo "=========================================="

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
              --output json


            # ====================================================
            # 10. Get Target Group ARN
            # ====================================================
            echo ""
            echo "Getting target group ARN..."

            TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups \
              --names "$TARGET_GROUP_NAME" \
              --region "$AWS_REGION" \
              --query "TargetGroups[0].TargetGroupArn" \
              --output text)

            if [ -z "$TARGET_GROUP_ARN" ] || [ "$TARGET_GROUP_ARN" = "None" ]; then
              echo "ERROR: Target group not found."
              exit 1
            fi

            echo "Target Group ARN:"
            echo "$TARGET_GROUP_ARN"


            # ====================================================
            # 11. Wait for ALB health
            # ====================================================
            echo ""
            echo "=========================================="
            echo "Waiting for ALB target to become healthy"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

            HEALTHY=false

            for i in {1..30}
            do

              HEALTH=$(aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_GROUP_ARN" \
                --targets Id="$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "TargetHealthDescriptions[0].TargetHealth.State" \
                --output text 2>/dev/null || echo "unknown")

              echo "ALB health attempt $i/30: $HEALTH"


              if [ "$HEALTH" = "healthy" ]; then
                HEALTHY=true
                break
              fi

              sleep 10

            done


            # ====================================================
            # 12. Fail if ALB health check fails
            # ====================================================
            if [ "$HEALTHY" != "true" ]; then

              echo ""
              echo "=========================================="
              echo "ERROR: ALB HEALTH CHECK FAILED"
              echo "Instance: $INSTANCE_ID"
              echo "=========================================="

              echo "Final target health:"

              aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_GROUP_ARN" \
                --targets Id="$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --output json

              exit 1
            fi


            # ====================================================
            # 13. Instance deployment successful
            # ====================================================
            echo ""
            echo "=========================================="
            echo "INSTANCE DEPLOYMENT SUCCESS"
            echo "Instance: $INSTANCE_ID"
            echo "Local application: HEALTHY"
            echo "ALB health: HEALTHY"
            echo "=========================================="


            # Give ALB and application a short stabilization period
            echo "Waiting 5 seconds before next instance..."
            sleep 5

          done


          # ======================================================
          # 14. All instances successfully deployed
          # ======================================================
          echo ""
          echo "=========================================="
          echo "ROLLING DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=========================================="
