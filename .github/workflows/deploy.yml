name: Build, Release & Rolling Deploy

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-deploy:
    name: Build, Release & Refresh ASG
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 8
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      # 3. Build JAR with Maven
      - name: Build with Maven
        run: |
          cd rest-api
          mvn clean package -DskipTests
          echo "Built JAR:"
          ls -lh target/*.jar

      # 4. Authenticate to AWS via OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Upload JAR Artifact to S3
      - name: Upload Artifact to S3
        id: s3-upload
        run: |
          S3_BUCKET="${{ vars.S3_ARTIFACT_BUCKET }}"
          DEPLOY_SHA="${{ github.sha }}"
          S3_URI="s3://${S3_BUCKET}/releases/${DEPLOY_SHA}/spring-boot-rest-api-v1.jar"

          echo "Uploading JAR to ${S3_URI}..."
          aws s3 cp rest-api/target/spring-boot-rest-api-v1.jar "${S3_URI}"

          echo "s3_jar_uri=${S3_URI}" >> "$GITHUB_OUTPUT"

      # 6. Create New Launch Template Version with Updated User Data
      - name: Create New Launch Template Version
        id: create-lt-version
        run: |
          LT_NAME="${{ vars.LAUNCH_TEMPLATE_NAME }}"
          S3_JAR_URI="${{ steps.s3-upload.outputs.s3_jar_uri }}"
          DEPLOY_SHA="${{ github.sha }}"

          # Replace placeholders in user-data template
          sed -e "s|__S3_JAR_PATH__|${S3_JAR_URI}|g" \
              -e "s|__DEPLOY_SHA__|${DEPLOY_SHA}|g" \
              deploy/user-data-template.sh > user-data-processed.sh

          USER_DATA_B64=$(base64 -w 0 user-data-processed.sh)

          echo "Creating new version for Launch Template: ${LT_NAME}"
          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-name "${LT_NAME}" \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"${USER_DATA_B64}\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "Created Launch Template Version: ${NEW_VERSION}"

          # Set as default version
          aws ec2 modify-launch-template \
            --launch-template-name "${LT_NAME}" \
            --default-version "${NEW_VERSION}"

          echo "Set Version ${NEW_VERSION} as Default"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      # 7. Trigger ASG Instance Refresh
      - name: Trigger ASG Instance Refresh
        run: |
          ASG="${{ vars.ASG_NAME }}"

          echo "Starting Instance Refresh for ASG: ${ASG}..."
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${ASG}" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180}' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "Instance Refresh ID: ${REFRESH_ID}"

          # Wait for Instance Refresh to Complete
          echo "Waiting for Instance Refresh to complete..."
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${ASG}" \
              --instance-refresh-ids "${REFRESH_ID}" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Current Status: ${STATUS}"

            if [ "$STATUS" = "Successful" ]; then
              echo "✅ Instance Refresh Completed Successfully!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "RollbackSuccessful" ]; then
              echo "❌ Instance Refresh ended with status: ${STATUS}"
              exit 1
            fi

            sleep 30
          done
