name: Spring Boot Rolling Deployment

# Run deployment whenever code is pushed to master
on:
  push:
    branches:
      - master

# Allow GitHub Actions to authenticate with AWS using OIDC
permissions:
  id-token: write
  contents: read

# Common deployment configuration
env:
  AWS_REGION: ap-south-1
  ASG_NAME: springboot-app-asg
  TARGET_GROUP_NAME: springboot-tg
  APP_DIR: /home/ssm-user/spring-boot-docker-rest-api/rest-api
  SERVICE_NAME: springboot

jobs:
  deploy:
    name: Rolling Deployment
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authenticate GitHub Actions with AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Confirm AWS authentication
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 4. Get all healthy InService instances from ASG
      - name: Get InService ASG instances
        id: instances
        shell: bash
        run: |
          echo "Getting instances from ASG: $ASG_NAME"

          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --region "$AWS_REGION" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService' && HealthStatus=='Healthy'].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "ERROR: No InService instances found."
            exit 1
          fi

          echo "Found instances:"
          echo "$INSTANCE_IDS"

          echo "instance_ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"

      # 5. Deploy to each EC2 instance one at a time
      - name: Rolling deployment
        shell: bash
        run: |
          set -e

          INSTANCE_IDS="${{ steps.instances.outputs.instance_ids }}"

          echo "Starting rolling deployment..."
          echo "Instances: $INSTANCE_IDS"

          for INSTANCE_ID in $INSTANCE_IDS
          do
            echo ""
            echo "=========================================="
            echo "Deploying instance: $INSTANCE_ID"
            echo "=========================================="

            # 6. Send deployment commands to EC2 through SSM
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 900 \
              --parameters 'commands=[
                "set -e",
                "export HOME=/home/ssm-user",
                "echo START_DEPLOYMENT",
                "echo INSTANCE: $(hostname)",
                "cd /home/ssm-user/spring-boot-docker-rest-api/rest-api",
                "git config --global --add safe.directory /home/ssm-user/spring-boot-docker-rest-api",
                "echo CURRENT_COMMIT:",
                "git rev-parse --short HEAD",
                "echo FETCHING_LATEST_CODE",
                "git fetch origin master",
                "git reset --hard origin/master",
                "echo NEW_COMMIT:",
                "git rev-parse --short HEAD",
                "echo BUILDING_APPLICATION",
                "./mvnw clean package -DskipTests",
                "echo BUILD_SUCCESS",
                "ls -lh target/spring-boot-rest-api-v1.jar",
                "echo RESTARTING_APPLICATION",
                "sudo systemctl restart springboot",
                "echo WAITING_FOR_APPLICATION",
                "sleep 15",
                "echo SERVICE_STATUS",
                "sudo systemctl is-active springboot",
                "echo LOCAL_HEALTH_CHECK",
                "curl --fail --silent --show-error http://localhost:9090/api/v1/categories/",
                "echo DEPLOYMENT_SUCCESS"
              ]' \
              --region "$AWS_REGION" \
              --query "Command.CommandId" \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"

            # 7. Wait until SSM deployment finishes
            echo "Waiting for SSM deployment..."

            SUCCESS=false

            for i in {1..90}
            do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")

              echo "Attempt $i - Status: $STATUS"

              if [ "$STATUS" = "Success" ]; then
                SUCCESS=true
                break
              fi

              # Stop if SSM reports a deployment failure
              if [ "$STATUS" = "Failed" ] || \
                 [ "$STATUS" = "Cancelled" ] || \
                 [ "$STATUS" = "TimedOut" ]; then

                echo "Deployment failed on $INSTANCE_ID"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "{Status:Status,StatusDetails:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json

                exit 1
              fi

              sleep 10
            done

            # 8. Fail if SSM did not finish within the timeout
            if [ "$SUCCESS" != "true" ]; then
              echo "ERROR: SSM command timed out."
              exit 1
            fi

            # 9. Show deployment logs
            echo ""
            echo "Deployment output:"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
              --output json

            # 10. Get ALB target group ARN
            TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups \
              --names "$TARGET_GROUP_NAME" \
              --region "$AWS_REGION" \
              --query "TargetGroups[0].TargetGroupArn" \
              --output text)

            if [ -z "$TARGET_GROUP_ARN" ] || [ "$TARGET_GROUP_ARN" = "None" ]; then
              echo "ERROR: Target group not found."
              exit 1
            fi

            # 11. Wait until the updated instance is healthy in ALB
            echo ""
            echo "Waiting for ALB target to become healthy..."

            HEALTHY=false

            for i in {1..30}
            do
              HEALTH=$(aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_GROUP_ARN" \
                --targets Id="$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "TargetHealthDescriptions[0].TargetHealth.State" \
                --output text 2>/dev/null || echo "unknown")

              echo "ALB health attempt $i: $HEALTH"

              if [ "$HEALTH" = "healthy" ]; then
                HEALTHY=true
                break
              fi

              sleep 10
            done

            # 12. Stop deployment if ALB health check fails
            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: Instance $INSTANCE_ID did not become healthy."
              exit 1
            fi

            # 13. Instance deployment completed successfully
            echo ""
            echo "=========================================="
            echo "Instance $INSTANCE_ID deployment SUCCESS"
            echo "ALB health: healthy"
            echo "=========================================="

            # Give the instance a short stabilization period
            sleep 5

          done

          # 14. All instances completed successfully
          echo ""
          echo "=========================================="
          echo "ROLLING DEPLOYMENT COMPLETED"
          echo "=========================================="
