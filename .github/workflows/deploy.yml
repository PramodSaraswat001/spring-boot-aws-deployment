name: Test GitHub Actions AWS OIDC

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show GitHub OIDC information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"
          echo "Repository Owner ID: $GITHUB_REPOSITORY_OWNER_ID"
          echo "Ref: $GITHUB_REF"
