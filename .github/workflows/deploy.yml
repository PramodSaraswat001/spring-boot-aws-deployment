name: Build & Deploy

on:
  push:
    branches:
      - master

permissions:
  id-token: write # Required for OIDC to assume AWS role
  contents: read # Required to checkout code

concurrency:
  group: production-deploy
  cancel-in-progress: false # Never cancel an in-progress deployment

env:
  AWS_REGION: ap-south-1

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: BUILD
  # Builds the Spring Boot JAR and uploads it to a fixed S3 path.
  # Overwrites the previous JAR on every successful build.
  # ═══════════════════════════════════════════════════════════════
  build:
    name: Build & Upload JAR
    runs-on: ubuntu-latest

    steps:
      # ─── STEP 1: Checkout Code ─────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ─── STEP 2: Setup Java 8 ──────────────────────────────────
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      # ─── STEP 3: Build JAR with Maven ──────────────────────────
      - name: Build with Maven
        run: |
          cd rest-api
          mvn clean package -DskipTests
          echo "Built JAR:"
          ls -lh target/*.jar

      # ─── STEP 4: Authenticate to AWS via OIDC ──────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ─── STEP 5: Upload JAR to Fixed S3 Location ───────────────
      # The S3 key is fixed and never changes.
      # Every push overwrites the previous JAR. No per-commit paths.
      - name: Upload JAR to S3 (fixed path)
        run: |
          S3_BUCKET="${{ vars.S3_ARTIFACT_BUCKET }}"
          S3_KEY="releases/spring-boot-rest-api-v1.jar"
          S3_URI="s3://${S3_BUCKET}/${S3_KEY}"

          echo "Uploading JAR to fixed location: ${S3_URI}"
          aws s3 cp rest-api/target/spring-boot-rest-api-v1.jar "${S3_URI}"
          echo "Upload complete. Previous JAR (if any) has been overwritten."

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: DEPLOY
  # Runs only after the Build job succeeds.
  # Triggers an ASG Instance Refresh. New EC2 instances will boot
  # and download the latest JAR from the fixed S3 location via
  # the Launch Template User Data script.
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy — Trigger ASG Instance Refresh
    runs-on: ubuntu-latest
    needs: build # Only runs if the build job succeeds

    steps:
      # ─── STEP 1: Authenticate to AWS via OIDC ──────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ─── STEP 2: Trigger ASG Instance Refresh ──────────────────
      - name: Trigger ASG Instance Refresh
        run: |
          ASG="${{ vars.ASG_NAME }}"

          echo "Starting Instance Refresh for ASG: ${ASG}..."
          # InstanceWarmup: 360s to accommodate base AMI package installation
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${ASG}" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 360}' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "Instance Refresh ID: ${REFRESH_ID}"

          # Wait for Instance Refresh to complete
          echo "Waiting for Instance Refresh to complete..."
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${ASG}" \
              --instance-refresh-ids "${REFRESH_ID}" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Current Status: ${STATUS}"

            if [ "$STATUS" = "Successful" ]; then
              echo "Instance Refresh Completed Successfully!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "RollbackSuccessful" ]; then
              echo "Instance Refresh ended with status: ${STATUS}"
              exit 1
            fi

            sleep 30
          done
