name: Test GitHub Actions AWS Access

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  test-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Test AWS connection
        run: |
          aws sts get-caller-identity

      - name: Test SSM command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-02e987472d8f85da2 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo GitHub Actions SSM test successful","hostname","systemctl is-active springboot"]' \
            --comment "GitHub Actions SSM test" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          sleep 5

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-02e987472d8f85da2
